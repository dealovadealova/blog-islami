<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membaca Artikel - Blog Islami</title>
  <!-- Tailwind + Typography Plugin untuk merapikan teks panjang -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <!-- Library pembaca YAML (Frontmatter) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <!-- Library pengubah Markdown menjadi HTML (Marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- Navigasi Atas -->
  <nav class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold tracking-wide hover:text-emerald-200 transition">&larr; Kembali ke Beranda</a>
    </div>
  </nav>

  <!-- Wadah Isi Artikel -->
  <main class="max-w-4xl mx-auto px-4 py-12" id="konten-artikel">
    <div class="text-center py-20">
      <p class="text-slate-500 text-lg animate-pulse">Sedang memuat tulisan...</p>
    </div>
  </main>

  <footer class="bg-slate-900 text-slate-400 py-8 text-center mt-12">
    <p class="text-sm">&copy; 2026 Blog Islami Irkham.</p>
  </footer>

  <script>
    async function muatIsiArtikel() {
      const wadah = document.getElementById('konten-artikel');
      // Mengambil nama file dari alamat URL (misal: ?file=kajian-perdana.md)
      const params = new URLSearchParams(window.location.search);
      const fileName = params.get('file');

      if (!fileName) {
        wadah.innerHTML = '<h2 class="text-2xl font-bold text-center text-red-500">Artikel tidak ditemukan.</h2>';
        return;
      }

      try {
        // Karena GitHub memblokir API jika terlalu sering diakses, kita ambil file mentahnya langsung dari raw.githubusercontent
        const url = `https://raw.githubusercontent.com/dealovadealova/blog-islami/main/artikel/${fileName}`;
        const res = await fetch(url);
        
        if (!res.ok) throw new Error('Gagal mengambil file');
        
        const teks = await res.text();
        const pembatas = teks.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
        
        if (pembatas) {
          const pengaturan = jsyaml.load(pembatas[1]);
          const isiMarkdown = pembatas[2];
          
          // Mengubah teks Markdown menjadi HTML murni
          const isiHTML = marked.parse(isiMarkdown);
          
          // Mengubah judul halaman tab browser
          document.title = pengaturan.title + " - Blog Islami";

          // Cek apakah ada gambar ilustrasi
          let gambarHTML = '';
          if (pengaturan.thumbnail) {
             gambarHTML = `<img src="${pengaturan.thumbnail}" alt="${pengaturan.title}" class="w-full h-64 md:h-96 object-cover rounded-2xl shadow-sm mb-8">`;
          }

          // Mencetak isi tulisan
          wadah.innerHTML = `
            <article class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-12">
              ${gambarHTML}
              <div class="mb-8 border-b border-slate-100 pb-8 text-center">
                <span class="inline-block bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full text-sm uppercase tracking-wider mb-4">${pengaturan.category || 'Kajian'}</span>
                <h1 class="text-3xl md:text-5xl font-bold text-slate-800 leading-tight">${pengaturan.title}</h1>
              </div>
              
              <!-- 'prose' adalah sihir Tailwind agar teks artikel tertata sangat rapi -->
              <div class="prose prose-slate prose-emerald max-w-none md:text-lg leading-relaxed">
                ${isiHTML}
              </div>
            </article>
          `;
        }
      } catch (error) {
        console.error(error);
        wadah.innerHTML = '<h2 class="text-2xl font-bold text-center text-red-500">Gagal memuat artikel. Silakan coba lagi.</h2>';
      }
    }

    document.addEventListener('DOMContentLoaded', muatIsiArtikel);
  </script>
</body>
</html>
