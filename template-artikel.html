  <!-- SCRIPT JAM DIGITAL -->
  <script>
    function jalankanSistemWaktu() {
      const now = new Date();
      const jam = String(now.getHours()).padStart(2, '0');
      const menit = String(now.getMinutes()).padStart(2, '0');
      const detik = String(now.getSeconds()).padStart(2, '0');
      if(document.getElementById('jam-digital')) {
        document.getElementById('jam-digital').innerText = `${jam}:${menit}:${detik} WIB`;
      }
      
      const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][now.getDay()];
      const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'][now.getMonth()];
      const refDate = new Date(2021, 0, 1);
      const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const bedaHari = Math.floor((todayDate - refDate) / (1000 * 3600 * 24));
      const pasaranArr = ['Pahing', 'Pon', 'Wage', 'Kliwon', 'Legi'];
      let indeksPasaran = (bedaHari % 5);
      if (indeksPasaran < 0) indeksPasaran += 5; 
      
      if(document.getElementById('tanggal-jawa')) {
        document.getElementById('tanggal-jawa').innerText = `${namaHari} ${pasaranArr[indeksPasaran]}, ${now.getDate()} ${namaBulan} ${now.getFullYear()}`;
      }
    }
    setInterval(jalankanSistemWaktu, 1000);
    jalankanSistemWaktu();
  </script>

  <!-- DATABASE FIREBASE (Telah Dibaca & Suka) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCuyAt8PRNr7JhMEoZTXi9YqjQVocYwY_w",
      authDomain: "irkham1.firebaseapp.com",
      projectId: "irkham1",
      storageBucket: "irkham1.firebasestorage.app",
      messagingSenderId: "761381762698",
      appId: "1:761381762698:web:a3d61cd79c3e16edd39f73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const fileName = "{{NAMA_FILE_MD}}"; 
    window.namaFileAktif = fileName;

    setTimeout(async () => {
      let angkaPembaca = 1;
      let jumlahLike = 0;
      const refDokumen = doc(db, "artikel", fileName);
      
      try {
        const dataFirebase = await getDoc(refDokumen);
        if (dataFirebase.exists()) {
          await updateDoc(refDokumen, { dibaca: increment(1) });
          angkaPembaca = dataFirebase.data().dibaca + 1;
          jumlahLike = dataFirebase.data().suka || 0;
        } else {
          await setDoc(refDokumen, { dibaca: 1, suka: 0 });
        }
      } catch (dbError) {
        console.error("Gagal Firebase:", dbError);
        angkaPembaca = "1";
      }

      document.getElementById('tampilan-angka-baca').innerText = angkaPembaca;
      document.getElementById('tampilan-angka-baca').classList.remove('animate-pulse');
      
      document.getElementById('angka-like').innerText = jumlahLike;
      document.getElementById('angka-like').classList.remove('animate-pulse');
      window.jumlahLikeAktif = jumlahLike; 
    }, 100);

    const sudahLike = localStorage.getItem('suka_' + fileName) === 'ya';
    if(sudahLike) {
      const btn = document.getElementById('btn-like');
      const icon = document.getElementById('icon-like');
      icon.setAttribute('fill', 'currentColor');
      btn.classList.add('border-pink-500', 'text-pink-500');
      btn.classList.remove('border-slate-200', 'text-slate-600');
    }

    window.klikLike = async function() {
      if (!fileName) return;
      if (localStorage.getItem('suka_' + fileName) === 'ya') {
        alert("Terima kasih, Anda sudah menyukai artikel ini!");
        return;
      }

      const btn = document.getElementById('btn-like');
      const icon = document.getElementById('icon-like');
      const angka = document.getElementById('angka-like');
      
      let jumlahSekarang = window.jumlahLikeAktif || parseInt(angka.innerText) || 0;
      angka.innerText = jumlahSekarang + 1;
      icon.setAttribute('fill', 'currentColor');
      btn.classList.add('border-pink-500', 'text-pink-500');
      btn.classList.remove('border-slate-200', 'text-slate-600');
      
      localStorage.setItem('suka_' + fileName, 'ya');

      try {
        const refDokumen = doc(db, "artikel", fileName);
        await updateDoc(refDokumen, { suka: increment(1) });
      } catch (e) {
        console.error("Gagal Suka Firebase", e);
      }
    };

    // Panggil Disqus
    window.disqus_config = function () {
        this.page.url = window.location.href;  
        this.page.identifier = fileName; 
    };
    const d = document, s = d.createElement('script');
    s.src = 'https://irkham.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
  </script>
