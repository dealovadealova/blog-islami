  <!-- SCRIPT FUNGSI TOMBOL SHARE -->
  <script>
    function shareWA() {
      const judul = encodeURIComponent("{{JUDUL}}");
      const url = encodeURIComponent(window.location.href);
      window.open(`https://api.whatsapp.com/send?text=${judul}\%0A${url}`, '_blank');
    }
    function shareFB() {
      const url = encodeURIComponent(window.location.href);
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
    }
    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("Link artikel berhasil disalin!");
      });
    }
  </script>

  <!-- SCRIPT OTOMATIS MERAPIKAN TEKS ARAB -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const semuaParagraf = document.querySelectorAll('.prose p, .prose h1, .prose h2, .prose h3, .prose blockquote, .prose span, .prose div');
      const polaArab = /[\u0600-\u06FF]/;
      
      semuaParagraf.forEach(el => {
        if (polaArab.test(el.innerText)) {
          el.style.fontFamily = "'Amiri', 'Traditional Arabic', serif";
          el.style.fontSize = "1.75rem"; // Memperbesar font Arab
          el.style.lineHeight = "2.4";
          el.style.textAlign = "right"; // Memaksa rata kanan
          el.dir = "rtl"; // Set arah kanan ke kiri
          el.classList.add("text-emerald-800", "my-6"); 
        }
      });
    });
  </script>
