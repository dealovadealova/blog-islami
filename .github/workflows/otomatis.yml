name: Buat HTML Otomatis

on:
  push:
    paths:
      - 'artikel/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buat-html-otomatis
  cancel-in-progress: false

jobs:
  bangun-html:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Data Web
        uses: actions/checkout@v3

      - name: Siapkan Mesin Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Alat Pengubah Teks
        run: npm install marked

      - name: Jalankan Mesin Pembuat HTML
        run: node build.js

      - name: Buat Sitemap
        run: node buat-sitemap.mjs

      - name: Simpan HTML dan Sitemap ke GitHub
        run: |
          git config user.name "Robot Irkham"
          git config user.email "robot@irkham.com"

          shopt -s nullglob
          files=(*.html)
          [ -f sitemap.xml ] && files+=(sitemap.xml)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Tidak ada file HTML atau sitemap untuk di-commit"
            exit 0
          fi

          git add -- "${files[@]}"

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
            exit 0
          fi

          git commit -m "Auto-generate artikel HTML dan sitemap"
          git stash --include-untracked || true
          git pull --rebase
          git push
